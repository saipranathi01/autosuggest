<!DOCTYPE html>
<html lang="en">
<head>
    
    <title>Toggle</title>
    <link rel="stylesheet" href="../css/index.css">
</head>
<body>

    <div class="navbar">
        <a href="/">Home</a>
        <a href="/pages/card.html">Card</a>
        <a href="/pages/toggle2.html">Toggle</a>
         <a href="">random user</a>    
    </div>

    <div class="card">
        <img id="userImage" src="../images/john.png" alt="User image">
        <h2 id="userName">John</h2>
        <p id="userGender">Male</p>
        <button onclick="toggleGender()" id="toggleBtn">Toggle</button>
    </div>

    <script>
        let isMale = true;

        const male = {
            src: '../images/john.png',
            name: 'John',
            gender: 'Male'
        };

        const female = {
            src: '../images/jane.png',
            name: 'Jane',
            gender: 'Female'
        };

        function toggleGender() {
            isMale = !isMale;
            const user = isMale ? male : female;

            document.getElementById('userImage').src = user.src;
            document.getElementById('userName').textContent = user.name;
            document.getElementById('userGender').textContent = user.gender;
        }
    </script>

</body>
</html>
